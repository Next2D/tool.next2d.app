name: Integration UnitTest

on:
  push:
    branches:
      - main
      - develop
      - feature/typescript
  pull_request:
    branches:
      - main
      - develop
      - feature/typescript

jobs:
  macos-browser-test:
    runs-on: macos-latest
    steps:
      - uses: actions/setup-node@v5
      
      # tool-typescriptをcheckout
      - name: Checkout tool-typescript
        uses: actions/checkout@v5
        with:
          path: tool-typescript
      
      # playerをcheckout (peerDependenciesで参照)
      - name: Checkout player
        uses: actions/checkout@v5
        with:
          repository: Next2D/player
          ref: main
          path: player
      
      # playerの依存関係をインストール
      - name: Install player dependencies
        working-directory: player
        run: npm install
      
      # tool-typescriptの依存関係をインストール
      - name: Install tool-typescript dependencies
        working-directory: tool-typescript
        run: npm install
      
      # tool-typescriptのテストを実行
      - name: Run tool-typescript tests
        working-directory: tool-typescript
        run: npm run test

  windows-browser-test:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v5
      
      # tool-typescriptをcheckout
      - name: Checkout tool-typescript
        uses: actions/checkout@v5
        with:
          path: tool-typescript
      
      # playerをcheckout (peerDependenciesで参照)
      - name: Checkout player
        uses: actions/checkout@v5
        with:
          repository: Next2D/player
          ref: main
          path: player
      
      # playerの依存関係をインストール
      - name: Install player dependencies
        working-directory: player
        run: npm install
      
      # tool-typescriptの依存関係をインストール
      - name: Install tool-typescript dependencies
        working-directory: tool-typescript
        run: npm install
      
      # tool-typescriptのテストを実行
      - name: Run tool-typescript tests
        working-directory: tool-typescript
        run: npm run test
