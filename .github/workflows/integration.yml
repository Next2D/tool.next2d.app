name: Integration UnitTest

on:
  push:
    branches:
      - main
      - develop
      - feature/typescript
  pull_request:
    branches:
      - main
      - develop
      - feature/typescript

jobs:
  macos-browser-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: git clone -b develop git@github.com:Next2D/player.git
      - run: npm install
      - run: npm run test

  windows-browser-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: git clone -b develop git@github.com:Next2D/player.git
      - run: npm install
      - run: npm run test
